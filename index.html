<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="sq-version" content="1.0.4">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Quest — Exam Prep RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;700&family=Merriweather:wght@400;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b1e;--p1:#171a3a;--p2:#222654;--tx:#f2f3ff;--mu:#9b9fd0;--ac:#8a63ff;--ac2:#4cc9ff;--good:#2ee59d;--bad:#ff5470;--gold:#ffc83d;--hue:255}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,hsl(var(--hue) 60% 22%),transparent),radial-gradient(900px 500px at 100% 10%,#3a1050,transparent),var(--bg);padding-bottom:84px}
#app{max-width:760px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0} h2{font-size:20px;margin:18px 0 8px} .mu{color:var(--mu);font-size:13px}
.glass{background:linear-gradient(160deg,#ffffff14,#ffffff06);border:1px solid #ffffff1c;border-radius:18px;padding:14px;margin:10px 0;backdrop-filter:blur(6px);box-shadow:0 8px 30px #0006}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
button{font:inherit;color:var(--tx);border:0;border-radius:14px;padding:10px 16px;cursor:pointer;background:linear-gradient(180deg,var(--ac),#6a45e0);box-shadow:0 4px 0 #3b2490,0 8px 16px #0005;transition:transform .08s,box-shadow .08s;font-weight:700}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #3b2490}
button.alt{background:linear-gradient(180deg,#34397a,#272b61);box-shadow:0 4px 0 #14173a}
button.gold{background:linear-gradient(180deg,#ffd75e,#f0a500);color:#3b2700;box-shadow:0 4px 0 #9a6700}
button:disabled{opacity:.4;cursor:not-allowed}
.bar{height:12px;background:#0007;border-radius:99px;overflow:hidden;border:1px solid #ffffff18}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .35s}
.bar.hp>i{background:linear-gradient(90deg,#ff3d6a,#ff9a5c)} .bar.tm>i{background:linear-gradient(90deg,#ffd75e,#ff5470);transition:width .1s linear}
.pill{background:#0006;border-radius:99px;padding:4px 12px;font-weight:700;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0a0a1ccc;backdrop-filter:blur(12px);border-top:1px solid #ffffff1a;z-index:5}
.nav button{flex:1;max-width:120px;padding:8px 4px;font-size:12px;background:transparent;box-shadow:none;border-radius:12px}
.nav button.on{background:#ffffff1c} .nav b{display:block;font-size:22px}
/* region path */
.path{display:flex;flex-direction:column;gap:0;align-items:center;margin:14px 0}
.node{position:relative;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:radial-gradient(circle at 30% 25%,#ffffff40,transparent 40%),linear-gradient(160deg,hsl(var(--hue) 70% 55%),hsl(var(--hue) 70% 30%));box-shadow:0 6px 0 hsl(var(--hue) 60% 18%),0 12px 20px #0007;cursor:pointer;transition:transform .1s}
.node:hover{transform:scale(1.07)} .node.lock{filter:grayscale(1) brightness(.5);cursor:not-allowed}
.node.cur{animation:pulse 1.4s infinite} .node small{position:absolute;bottom:-18px;font-size:14px;letter-spacing:2px}
.node.boss{width:104px;height:104px;font-size:48px;background:linear-gradient(160deg,#ff5470,#7a1030)}
.link{width:6px;height:34px;background:repeating-linear-gradient(#ffffff40 0 6px,transparent 6px 12px);margin:14px 0 4px}
.path .node:nth-of-type(odd){margin-left:-90px}.path .node:nth-of-type(even){margin-left:90px}
@keyframes pulse{50%{box-shadow:0 6px 0 hsl(var(--hue) 60% 18%),0 0 0 14px #ffffff18,0 0 40px hsl(var(--hue) 90% 60%)}}
/* battle */
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stage{position:relative;height:190px;margin:8px 0;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,hsl(var(--hue) 50% 25%),hsl(var(--hue) 60% 10%));border:1px solid #ffffff22}
.stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#0000,#000a)}
.fighter{position:absolute;bottom:26px;font-size:76px;transition:transform .18s;filter:drop-shadow(0 8px 6px #000a);z-index:2}
#pl{left:12%}#mo{right:12%;font-size:88px}
.fighter.idle{animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-8px)}}
.lr{transform:translateX(120px) scale(1.2)!important}.ll{transform:translateX(-120px) scale(1.2)!important}
.hit{animation:hit .4s}@keyframes hit{20%{transform:translateX(-14px);filter:brightness(3)}60%{transform:translateX(12px)}}
.dead{transform:rotate(90deg) translateY(30px);opacity:0;transition:all .8s}
.float{position:absolute;font-weight:900;font-size:30px;z-index:4;animation:fl 1s forwards;text-shadow:0 2px 0 #000}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:8;animation:fa .35s forwards}@keyframes fa{from{opacity:.5}to{opacity:0}}
.shakeS{animation:shk .35s}@keyframes shk{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-4px,2px)}}
.qp{min-height:230px}
.q{font-size:20px;font-weight:700;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:linear-gradient(180deg,#34397a,#272b61);box-shadow:0 4px 0 #14173a}
.opt.good{background:linear-gradient(180deg,#3df2ac,#17b87a);color:#032a1b;box-shadow:0 4px 0 #0b6b49}
.opt.bad{background:linear-gradient(180deg,#ff6a85,#d32a4c);box-shadow:0 4px 0 #7b1228}
.opt kbd{opacity:.6;margin-right:8px}
input.ty{width:100%;background:#0008;color:var(--tx);border:2px solid var(--ac);border-radius:12px;padding:12px;font:inherit;font-size:18px}
.items{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.items button{padding:6px 10px;font-size:14px}
.combo{font-weight:900;color:var(--gold);text-shadow:0 0 12px #ffc83d88}
.flip{perspective:900px;height:200px;cursor:pointer}.flip>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:20px;border-radius:18px;background:linear-gradient(160deg,#2c3178,#1b1e4a);border:1px solid #fff3}.face.b{transform:rotateY(180deg);background:linear-gradient(160deg,#1c6b57,#0d3b32)}
.big{font-size:64px;text-align:center}.center{text-align:center}
.ach{opacity:.35;text-align:center;font-size:12px}.ach.on{opacity:1}.ach b{display:block;font-size:30px}
textarea,input[type=text],input[type=date],input[type=number]{width:100%;background:#0008;color:var(--tx);border:1px solid #ffffff30;border-radius:12px;padding:10px;font:inherit}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:linear-gradient(180deg,#ffd75e,#f0a500);color:#3b2700;padding:10px 20px;border-radius:99px;font-weight:900;z-index:20;animation:tin .4s;box-shadow:0 8px 24px #0008}
@keyframes tin{from{transform:translate(-50%,-40px);opacity:0}}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),#ffffff1a 0);display:grid;place-items:center}
.ring>div{width:68px;height:68px;border-radius:50%;background:#12143a;display:grid;place-items:center;font-weight:900;text-align:center;line-height:1.1;font-size:14px}
.cls{cursor:pointer;text-align:center}.cls.on{outline:3px solid var(--gold)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}

/* ===== battle 2.0 ===== */
body.inbattle .nav{display:none}
.bt{max-width:980px;margin:0 auto}
.bt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.bt-title{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--mu)}
.arena{position:relative;height:300px;border-radius:24px;overflow:hidden;border:1px solid #ffffff2a;box-shadow:0 20px 60px #000a,inset 0 0 80px #0008;background:linear-gradient(180deg,hsl(var(--hue) 55% 30%) 0%,hsl(var(--hue) 60% 14%) 60%,#05050f 100%)}
.a-bg{position:absolute;inset:0;background:radial-gradient(circle at 18% 28%,hsl(var(--hue) 90% 70% / .28),transparent 42%),radial-gradient(circle at 82% 18%,#ffffff22,transparent 30%)}
.a-floor{position:absolute;left:-10%;right:-10%;bottom:-24px;height:120px;background:linear-gradient(#0000,#000c),repeating-linear-gradient(90deg,#ffffff12 0 2px,transparent 2px 64px);transform:perspective(300px) rotateX(58deg);transform-origin:bottom}
.plate{position:absolute;top:12px;padding:8px 12px;border-radius:14px;background:#000a;border:1px solid #ffffff2a;backdrop-filter:blur(6px);z-index:3}
.pplate{left:12px;display:flex;gap:10px;align-items:center}.pplate .av{font-size:34px}
.mplate{right:12px;width:min(270px,54%)}
.hearts{font-size:15px;letter-spacing:1px}
.pips{display:flex;gap:4px;margin-top:3px;align-items:center}
.pips i{width:14px;height:14px;border-radius:50%;background:#ffffff1c;border:1px solid #ffffff44}
.pips i.on{background:radial-gradient(circle at 35% 30%,#fff,#ffd75e 60%,#f0a500);box-shadow:0 0 10px #ffc83d;border-color:#fff}
.armed{color:var(--gold);font-size:11px;letter-spacing:.1em;animation:blink .6s infinite}@keyframes blink{50%{opacity:.3}}
.bar.thin{height:6px}.bar.hp{position:relative}.bar.hp u{position:absolute;top:0;bottom:0;width:2px;background:#fff9}
.arena .fighter{bottom:36px;font-size:84px}#pl{left:13%}#mo{right:11%;font-size:100px}
/* the pot, climbing in the title bar */
/* the pressure dial, coloured by how much trouble you have asked for */
.chip.pres.p1{color:#7fe0b0}
.chip.pres.p2{color:#ffd166}
.chip.pres.p3{color:#ff9a4d}
.chip.pres.p4{color:#ff5470;font-weight:800}

table.cal{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
table.cal th{text-align:left;font:600 11px/1 var(--font-b);letter-spacing:.1em;text-transform:uppercase;opacity:.6;padding:4px 6px}
table.cal td{padding:5px 6px;border-top:1px solid rgba(255,255,255,.07)}

.pot{font:600 12px/1 var(--font-b);color:#ffc83d;opacity:.95;white-space:nowrap;margin-left:auto;padding-right:8px}
.pot b{font-size:14px}
.pot.bump{animation:potb .32s ease}
@keyframes potb{0%{transform:scale(1)}40%{transform:scale(1.22);filter:brightness(1.5)}100%{transform:scale(1)}}

/* ONE heart left. The whole screen knows about it: a red pulse round the edge that never stops until
   the fight does. It is meant to be uncomfortable - that is the entire point of a last stand.

   Its own element, not body::after - that pseudo-element is already the film grain, with its own
   opacity and mix-blend-mode, and borrowing it made the red vanish into the blend instead of glowing. */
.lsglow{
  position:fixed;inset:0;pointer-events:none;z-index:44;
  box-shadow:inset 0 0 130px 14px rgba(255,32,63,.55);
  animation:lspulse 1.05s ease-in-out infinite;
}
@keyframes lspulse{0%,100%{opacity:.5}50%{opacity:1}}
body.laststand .plate{border-color:rgba(255,64,96,.5)}

.fighter.charge{animation:chg .22s infinite!important;filter:drop-shadow(0 0 18px #ff2d55) saturate(1.6)}
@keyframes chg{25%{transform:translateX(-4px) scale(1.05)}75%{transform:translateX(4px) scale(1.05)}}
.fighter.enrage{filter:drop-shadow(0 0 22px #ff2d55) hue-rotate(-35deg) saturate(1.8)}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:6;pointer-events:none;animation:ban 1.25s forwards}
.banner b{display:block;font-size:34px;letter-spacing:.14em;font-weight:900;color:#fff;text-shadow:0 0 24px hsl(var(--hue) 100% 70%),0 3px 0 #000}
.banner small{display:block;color:var(--gold);font-weight:800;letter-spacing:.2em;text-shadow:0 2px 0 #000}
@keyframes ban{0%{opacity:0;transform:scale(.6)}14%{opacity:1;transform:scale(1.12)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-14px)}}
.qte{position:absolute;inset:0;z-index:7;cursor:pointer;display:grid;place-items:center;background:#0005}
.qte .qc{position:absolute;width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;font-weight:900;letter-spacing:.1em;background:#000a;box-shadow:0 0 24px #fff8}
.qte .qr{position:absolute;width:76px;height:76px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 22px var(--gold);animation:qr .9s linear forwards}
@keyframes qr{from{transform:scale(2.6);opacity:.25}to{transform:scale(.7);opacity:1}}
.opts{display:grid;gap:8px;grid-template-columns:1fr}@media(min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.opts .opt{margin:0}
.dock{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:10px}
.skill{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 14px;border-radius:16px;background:linear-gradient(180deg,#2a2e68,#1a1d48);box-shadow:0 4px 0 #0c0e2a}
.skill small{display:block;font-weight:500;font-size:11px;opacity:.75}.skill .se{font-size:26px}.skill .sc{margin-left:auto;font-weight:900}
.skill.ready{background:linear-gradient(180deg,#ffd75e,#f0a500);color:#3b2700;box-shadow:0 4px 0 #9a6700,0 0 24px #ffc83d88;animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 4px 0 #9a6700,0 0 42px #ffc83dcc}}
.items{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.ico{position:relative;display:grid;justify-items:center;padding:6px 10px;min-width:58px;border-radius:14px;background:linear-gradient(180deg,#34397a,#272b61);box-shadow:0 3px 0 #14173a}
.ico span{font-size:22px}.ico small{font-size:10px;opacity:.8}.ico sup{position:absolute;top:-6px;right:-4px;background:var(--gold);color:#3b2700;border-radius:99px;padding:0 6px;font-size:11px;font-weight:900}
@media(max-width:600px){.pplate{padding:6px 8px;gap:6px;left:8px}.pplate .av{font-size:24px}.pplate b{display:none}.hearts{font-size:11px;letter-spacing:0;max-width:96px}.pips i{width:10px;height:10px}.mplate{right:8px;width:50%;padding:6px 9px}.arena{height:250px}.arena .fighter{font-size:58px}#mo{font-size:72px}.mplate{width:56%}.banner b{font-size:24px}}

/* ===================== PREMIUM GAME-CENTER THEME ===================== */
:root{--font-d:"Rajdhani","Trebuchet MS",system-ui,sans-serif;--font-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--glow:hsl(var(--hue) 100% 68%)}
html,body{font-family:var(--font-b);background:#070716}
body{background:#070716!important;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;background:radial-gradient(620px 420px at 14% 8%,hsl(var(--hue) 70% 30% / .55),transparent 70%),radial-gradient(720px 520px at 92% 18%,#5b1fa066,transparent 70%),radial-gradient(820px 620px at 50% 112%,#0b3a6b66,transparent 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3%,2%) scale(1.08)}}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
#app{max-width:1100px;margin:0 auto;padding:84px 16px 112px}
h1,h2,h3{font-family:var(--font-d)}
h1{font-size:34px;letter-spacing:.03em;text-transform:uppercase;font-weight:700;line-height:1.05}
h2{font-size:22px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin:28px 0 10px}
.mu{color:#9da2d6}
/* topbar HUD */
#topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:20;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(180deg,#0a0a1ef2,#0a0a1ecc);backdrop-filter:blur(14px);border-bottom:1px solid #ffffff1a;box-shadow:0 8px 30px #0008}
.brand{font-family:var(--font-d);letter-spacing:.2em;font-size:18px;white-space:nowrap;font-weight:700}
.brand b{background:linear-gradient(90deg,#fff,var(--glow));-webkit-background-clip:text;background-clip:text;color:transparent}
.me{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.me .av{width:42px;height:42px;display:grid;place-items:center;font-size:25px;border-radius:50%;background:linear-gradient(160deg,#3a3f8a,#1a1d48);border:2px solid var(--gold);box-shadow:0 0 16px #ffc83d66;flex:none}
.lv{display:grid;gap:3px;min-width:120px}.lv b{font-size:14px;line-height:1}.lv span{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.14em}
.bar.xp{height:6px}.bar.xp i{background:linear-gradient(90deg,#ffd75e,#ff9a3d)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff24;font-weight:800;cursor:pointer;font-size:14px;white-space:nowrap;color:var(--tx)}
button.chip{box-shadow:none!important;background:#ffffff14;font-family:var(--font-b);text-transform:none;letter-spacing:0;padding:6px 13px}
button.chip:active{transform:scale(.96)}
/* nav */
.nav{background:linear-gradient(180deg,#0a0a1ecc,#0a0a1ef0)}
.nav button{font-family:var(--font-d);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:#b9bdf0}
.nav button.on{color:#fff;background:linear-gradient(180deg,hsl(var(--hue) 80% 55% / .35),transparent);box-shadow:inset 0 2px 0 var(--glow)}
.nav button.on b{filter:drop-shadow(0 0 8px var(--glow))}
@media(min-width:900px){
 .nav{left:0;right:auto;top:64px;bottom:0;width:100px;flex-direction:column;justify-content:flex-start;gap:6px;padding:16px 8px;border-top:0;border-right:1px solid #ffffff1a}
 .nav button{max-width:none;width:100%;padding:12px 4px}
 .nav button.on{background:linear-gradient(90deg,hsl(var(--hue) 80% 55% / .35),transparent);box-shadow:inset 3px 0 0 var(--glow)}
 #app{padding-left:124px}}
body.inbattle #topbar,body.inpaper #topbar{display:none!important}
body.inbattle #app,body.inpaper #app{padding:16px}
/* surfaces */
.glass{background:linear-gradient(160deg,#ffffff17,#ffffff06);border:1px solid #ffffff22;border-radius:20px;box-shadow:0 10px 34px #0007,inset 0 1px 0 #ffffff26}
/* buttons */
button{font-family:var(--font-d);font-size:15px;letter-spacing:.07em;font-weight:700;text-transform:uppercase;border-radius:12px;padding:10px 18px;position:relative;overflow:hidden}
button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff44 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s;pointer-events:none}
button:hover:not(:disabled)::after{transform:translateX(120%)}
button.opt,.opts button,button.ico,button.skill,.nav button,button.sm{text-transform:none}
button.opt{font-family:var(--font-b);font-size:16px;font-weight:600;letter-spacing:0;border-radius:14px}
button.ico,button.skill{font-family:var(--font-b);letter-spacing:0}
button.sm,.sm{padding:4px 11px!important;font-size:12px!important}
/* view transition */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
#app.enter>*{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(n+6){animation-delay:.25s}
/* splash */
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(600px 400px at 50% 40%,#2a1d6a,#070716 70%);display:grid;place-content:center;justify-items:center;gap:8px;transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sp-logo{font-size:84px;animation:bob 1.6s infinite ease-in-out;filter:drop-shadow(0 0 30px #8a63ff)}
.sp-t{font-family:var(--font-d);font-size:44px;letter-spacing:.3em;font-weight:700;background:linear-gradient(90deg,#fff,#b9a3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-s{color:#9da2d6;letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.sp-bar{width:220px;height:4px;border-radius:9px;background:#ffffff1c;overflow:hidden;margin-top:10px}.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a63ff,#4cc9ff);animation:load .9s ease-out forwards}@keyframes load{to{width:100%}}
/* home hub */

.qtext{font-size:23px;font-weight:700;line-height:1.3;margin:8px 0 16px}
.opt{display:flex!important;align-items:center;gap:12px;padding:13px 16px;font-size:17px}
.key{flex:none;display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:#0007;border:1px solid #ffffff33;font-family:var(--font-d);font-weight:700;font-size:15px;color:#d8dcff;transition:all .15s}
.opt:hover:not(:disabled) .key{background:var(--gold);color:#3b2700;border-color:var(--gold)}.opt .otx{flex:1}
.opt.good .key{background:#fff;color:#0b6b49}.opt.bad .key{background:#fff;color:#7b1228}
.opt.yes{border-left:4px solid var(--good)}.opt.no{border-left:4px solid var(--bad)}
.tfcard{padding:16px 18px;border-radius:16px;background:#0006;border:1px dashed #ffffff44;margin-bottom:12px}.tfans{font-size:22px;font-weight:800;margin-top:4px}
.typebox{display:flex;gap:10px;flex-wrap:wrap}.typebox .ty{flex:1;min-width:200px}
/* --- review card (after a miss) --- */
.review{display:grid;gap:10px}
.rv-head{display:flex;gap:12px;align-items:center}.rv-x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bad);font-weight:900;box-shadow:0 0 18px #ff547088}
.rv-q{font-weight:700;font-size:17px}
.rv-you,.rv-right{padding:10px 14px;border-radius:14px;display:grid;gap:2px}
.rv-you span,.rv-right span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9da2d6}
.rv-you{background:#ff547018;border:1px solid #ff547066}.rv-you b{color:#ff9aab;text-decoration:line-through;text-decoration-thickness:2px}
.rv-right{background:#2ee59d14;border:1px solid #2ee59d88;box-shadow:0 0 26px #2ee59d22}.rv-right b{color:var(--good);font-size:21px}
.rv-note{margin-top:4px;color:#b8f5dc;font-size:14px}.rv-go{width:100%;padding:14px}.sm2{padding:6px 14px!important;justify-self:start}
/* --- cards to remember --- */
.remember{max-width:660px;margin:14px auto;text-align:left;padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,#ffffff12,#ffffff05);border:1px solid #ffffff22}
.rm-list{max-height:230px;overflow:auto;margin:8px 0;display:grid;gap:6px}.rm{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 12px;border-radius:10px;background:#0006;font-size:14px}.rm b{color:var(--good);text-align:right}
@media(max-width:600px){.rm{grid-template-columns:1fr}.rm b{text-align:left}}
/* --- flashcards --- */
.tr-top{display:flex;align-items:center;gap:12px}.segs{display:flex;gap:4px;flex:1}.segs i{flex:1;height:8px;border-radius:99px;background:#ffffff1e;transition:background .3s}
.segs i.ok{background:var(--good)}.segs i.no{background:var(--bad)}.segs i.cur{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.deck{margin:18px auto;max-width:720px}.deck .flip{height:350px}
.face{flex-direction:column!important;gap:12px;padding:34px 30px!important;box-shadow:0 20px 60px #000a}
.ctag{position:absolute;top:16px;left:18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#b9a3ff;font-weight:800}.face.b .ctag{color:#8dffd0}
.gems{position:absolute;top:18px;right:18px;display:flex;gap:5px}.gems i{width:10px;height:10px;transform:rotate(45deg);background:#ffffff22;border-radius:2px}.gems i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.ftxt{font-size:27px;font-weight:700;line-height:1.3}.hint{position:absolute;bottom:16px;font-size:12px;color:#9da2d6;letter-spacing:.06em}
.fnote{position:absolute;bottom:18px;left:22px;right:22px;font-size:14px;color:#b8f5dc}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px;margin:0 auto}.rate button{padding:16px;font-size:18px;display:flex;gap:10px;align-items:center;justify-content:center}
.rate .no{background:linear-gradient(180deg,#ff6a85,#d32a4c);box-shadow:0 4px 0 #7b1228}.rate .yes{background:linear-gradient(180deg,#3df2ac,#17b87a);color:#032a1b;box-shadow:0 4px 0 #0b6b49}
.rate .key{color:#fff}.rate .yes .key{color:#032a1b;background:#ffffff66}
@media(max-width:600px){.ftxt{font-size:21px}.deck .flip{height:320px}}
/* --- papers --- */
.pq{border-left:3px solid hsl(var(--hue) 80% 60% / .6)}.pq-t{font-size:17px;line-height:1.4}
.cmdhint{margin:8px 0;padding:7px 12px;border-left:3px solid var(--glow);background:hsl(var(--hue) 70% 40% / .18);border-radius:0 10px 10px 0;font-size:13px;color:#d4d8ff}.cmdhint b{color:var(--glow);text-transform:uppercase;letter-spacing:.1em}
.pq-foot{display:flex;justify-content:space-between;font-size:12px;color:#9da2d6;margin-top:6px}.pq textarea{min-height:92px}
/* --- focus sessions --- */
.focuspanel{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:18px;margin-top:14px;background:linear-gradient(120deg,#12384a,#0d1b2e);border:1px solid #4cc9ff55;box-shadow:0 0 30px #4cc9ff22}
.chip.focus{border-color:#4cc9ff;color:#9be4ff;font-variant-numeric:tabular-nums}.chip.focus.break{border-color:#2ee59d;color:#8dffd0}
.chip .fxl{font-size:11px;letter-spacing:.1em;text-transform:uppercase}@media(max-width:700px){.chip .fxl{display:none}}
.sm-m{font-size:11px;color:var(--good);letter-spacing:.06em}
/* --- arena / shop --- */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:14px}
.feature{display:flex;gap:20px;align-items:center;padding:24px;border-radius:24px;position:relative;background:linear-gradient(135deg,hsl(var(--hue) 55% 22%),hsl(var(--hue) 65% 9%));border:1px solid hsl(var(--hue) 80% 60% / .45);box-shadow:0 18px 50px #000a,0 0 40px hsl(var(--hue) 90% 50% / .15)}
.f-art{font-size:84px;line-height:1;filter:drop-shadow(0 12px 18px #000a);animation:bob 3.2s infinite ease-in-out}.f-body{min-width:0}.feature h3{font-size:30px;text-transform:uppercase;letter-spacing:.04em;margin:2px 0 6px}
@media(max-width:700px){.feature{flex-direction:column;text-align:center}.f-art{font-size:64px}}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.shopgrid.skins{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.item{display:grid;justify-items:center;gap:6px;padding:16px 12px;border-radius:20px;text-align:center;background:linear-gradient(160deg,#ffffff16,#ffffff05);border:1px solid #ffffff22;box-shadow:0 10px 30px #0007;transition:transform .2s}
.item:hover{transform:translateY(-4px)}.it-art{font-size:50px;filter:drop-shadow(0 8px 10px #000a)}.item b{font-family:var(--font-d);font-size:19px;letter-spacing:.04em}
.owned{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9da2d6}.item.eq{border-color:var(--good);box-shadow:0 0 26px #2ee59d33}
.item button{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}.item button .ic{width:18px;height:18px}
.fxpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fxopt{display:grid;gap:4px;justify-items:start;text-align:left;text-transform:none;letter-spacing:0;font-family:var(--font-b);background:#ffffff0f!important;border:1px solid #ffffff22;box-shadow:none!important;padding:14px}
.fxopt b{font-family:var(--font-d);font-size:18px;letter-spacing:.06em;text-transform:uppercase}.fxopt small{font-weight:500;color:#9da2d6;font-size:12px;line-height:1.35}
.fxopt.on{border-color:var(--gold);background:linear-gradient(160deg,#4a3a10,#1d1708)!important;box-shadow:0 0 24px #ffc83d44!important}
/* --- CALM mode: everything decorative goes quiet --- */
body.fx-calm #glow,body.fx-calm .embers,body.fx-calm #bg,body.fx-calm::after{display:none}
body.fx-calm::before{animation:none}
body.fx-calm .fighter.idle,body.fx-calm .hero-art,body.fx-calm .rb-art,body.fx-calm .f-art,body.fx-calm .ico-flame,body.fx-calm .tile .emo{animation:none!important}
body.fx-calm .shakeS,body.fx-calm .hit,body.fx-calm .ll,body.fx-calm .lr{animation:none!important}
body.fx-calm .flash,body.fx-calm .rip,body.fx-calm .xpf{display:none}
body.fx-calm #app.enter>*{animation:none}
body.fx-calm button::after,body.fx-calm .bar>i::after{display:none}
body.fx-calm .tile.pulse,body.fx-calm .rw.can,body.fx-calm .skill.ready{animation:none}
body.fx-calm .banner b{font-size:24px}
body.fx-calm .cover:hover,body.fx-calm .item:hover,body.fx-calm .tile.click:hover{transform:none}
/* --- HYPE mode --- */
body.fx-hype #glow{width:820px;height:820px;margin:-410px 0 0 -410px}
body.fx-hype .embers i{box-shadow:0 0 16px hsl(var(--hue) 100% 70%)}

/* ===================== BATTLE ENVIRONMENTS + COMBAT FEEL ===================== */
.arena{--px:0;--py:0;transition:transform .1s}.arena.zoom{transform:scale(1.025)}
.a-lay{position:absolute;left:-40px;right:-40px;bottom:0;background-repeat:repeat-x;background-position:0 100%;background-size:1200px 100%;pointer-events:none}
.a-far{height:64%;z-index:0;transform:translate(calc(var(--px)*-8px),calc(var(--py)*-3px));animation:driftL 150s linear infinite}
.a-mid{height:48%;z-index:0;transform:translate(calc(var(--px)*-16px),calc(var(--py)*-5px));animation:driftL 95s linear infinite}
.a-near{height:30%;z-index:1;transform:translate(calc(var(--px)*-28px),calc(var(--py)*-6px))}
@keyframes driftL{to{background-position-x:-1200px}}
.a-bg{background:radial-gradient(circle at 18% 28%,color-mix(in srgb,var(--tint,#8a63ff) 34%,transparent),transparent 44%),radial-gradient(circle at 82% 18%,#ffffff22,transparent 30%)!important}
.a-floor{z-index:1}
.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.amb i{position:absolute;width:4px;height:4px;border-radius:50%;opacity:0;left:var(--l);top:var(--t,50%);animation-delay:var(--d);animation-duration:var(--du);animation-iteration-count:infinite}
.amb.firefly i{background:#e2ff8a;box-shadow:0 0 10px #e2ff8a;animation-name:ffl;animation-timing-function:ease-in-out}
.amb.snow i{top:-8px;background:#fff;animation-name:snowf;animation-timing-function:linear}
.amb.ember i{top:auto;bottom:-8px;background:#ffb25c;box-shadow:0 0 8px #ff7a2a;animation-name:emb;animation-timing-function:linear}
.amb.star i{background:#fff;animation-name:tw;animation-timing-function:ease-in-out}
@keyframes ffl{0%,100%{opacity:0;transform:translate(0,0)}25%{opacity:.95}50%{opacity:.35;transform:translate(30px,-22px)}75%{opacity:.95;transform:translate(-12px,-44px)}}
@keyframes snowf{from{transform:translate(0,0);opacity:0}10%{opacity:.9}to{transform:translate(34px,330px);opacity:.15}}
@keyframes emb{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.95}100%{transform:translate(22px,-290px) scale(1.2);opacity:0}}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:1;transform:scale(1.7)}}
.amb i:nth-child(1){--l:23%;--t:59%;--d:-4.8s;--du:7.4s}
.amb i:nth-child(2){--l:63%;--t:33%;--d:-6.9s;--du:6.6s}
.amb i:nth-child(3){--l:67%;--t:29%;--d:-3.5s;--du:5.6s}
.amb i:nth-child(4){--l:2%;--t:7%;--d:-2.6s;--du:7.1s}
.amb i:nth-child(5){--l:10%;--t:24%;--d:-5.6s;--du:5.5s}
.amb i:nth-child(6){--l:31%;--t:11%;--d:-3.1s;--du:9.0s}
.amb i:nth-child(7){--l:54%;--t:62%;--d:-0.2s;--du:6.0s}
.amb i:nth-child(8){--l:65%;--t:20%;--d:-4.5s;--du:8.7s}
.amb i:nth-child(9){--l:4%;--t:25%;--d:-5.2s;--du:4.9s}
.amb i:nth-child(10){--l:4%;--t:64%;--d:-1.1s;--du:7.8s}
.amb i:nth-child(11){--l:53%;--t:68%;--d:-1.1s;--du:7.5s}
.amb i:nth-child(12){--l:62%;--t:36%;--d:-0.5s;--du:5.4s}
.amb i:nth-child(13){--l:88%;--t:15%;--d:-0.9s;--du:6.6s}
.amb i:nth-child(14){--l:51%;--t:31%;--d:-2.4s;--du:5.2s}

.fighter::after{content:"";position:absolute;left:50%;bottom:-8px;width:78%;height:14px;margin-left:-39%;border-radius:50%;background:radial-gradient(#000b,transparent 70%);z-index:-1;pointer-events:none}
.fighter.idle.spawn{animation:spawn .6s cubic-bezier(.2,1.6,.3,1),bob 2s ease-in-out .6s infinite}
@keyframes spawn{from{transform:translateX(70px) scale(.2);opacity:0}}
.cast{animation:castk .25s}@keyframes castk{50%{transform:translateX(-12px) scale(1.1)}}
.proj{position:absolute;left:0;top:0;font-size:32px;z-index:5;pointer-events:none;will-change:transform}
.slashfx{position:absolute;width:120px;height:6px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--c,#fff),transparent);box-shadow:0 0 18px var(--c,#fff);transform:rotate(-35deg) scaleX(0);animation:slashk .32s ease-out forwards;z-index:5;pointer-events:none}
@keyframes slashk{40%{transform:rotate(-35deg) scaleX(1.4);opacity:1}to{transform:rotate(-35deg) scaleX(1.7);opacity:0}}
.clog{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:4;display:grid;gap:3px;justify-items:center;width:max-content;max-width:42%;pointer-events:none}
.cl{font-size:12px;padding:3px 10px;border-radius:8px;background:#000b;border-left:3px solid #ffffff55;animation:clin .25s;color:#e8eaff}
.cl.crit{border-color:var(--gold);color:#ffe08a}.cl.bad{border-color:var(--bad);color:#ffc2cc}.cl b{color:#fff}
@keyframes clin{from{opacity:0;transform:translateX(-10px)}}
.vs{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;gap:5vw;background:radial-gradient(circle at 50% 50%,#1a1040f0,#050510f8);cursor:pointer;animation:vsin .22s}
.vs>div{display:grid;justify-items:center;gap:6px;text-align:center}.vs>.vs-l,.vs>.vs-r{min-width:0;max-width:34vw}
.vs span{font-size:min(22vw,150px);line-height:1;filter:drop-shadow(0 18px 24px #000)}
.vs-l{animation:slideL .55s cubic-bezier(.2,1.2,.3,1)}.vs-r{animation:slideR .55s cubic-bezier(.2,1.2,.3,1)}
.vs b{font-family:var(--font-d);font-size:clamp(18px,3.6vw,36px);letter-spacing:.08em;text-transform:uppercase}
.vs small{color:var(--gold);letter-spacing:.3em;font-weight:800;font-size:12px}
.vs-mid{font-family:var(--font-d);font-size:clamp(46px,10vw,110px);font-weight:700;color:#fff;text-shadow:0 0 40px var(--glow),0 4px 0 #000;animation:vsmid .7s cubic-bezier(.2,1.8,.3,1) .25s both}
.vs-skip{position:absolute!important;bottom:26px;color:#9da2d6;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.vs.out{opacity:0;transition:opacity .24s}
@keyframes slideL{from{transform:translateX(-60vw);opacity:0}}@keyframes slideR{from{transform:translateX(60vw);opacity:0}}@keyframes vsmid{from{transform:scale(4);opacity:0}}@keyframes vsin{from{opacity:0}}
body.fx-calm .a-far,body.fx-calm .a-mid{animation:none}body.fx-calm .a-lay{transform:none!important}body.fx-calm .amb{display:none}
body.fx-calm .vs-l,body.fx-calm .vs-r,body.fx-calm .vs-mid{animation-duration:.2s}
@media(max-width:600px){.vs{gap:3vw}.vs span{font-size:min(24vw,96px)}.clog{max-width:56%}.cl{font-size:11px}}

.chip.upg{border-color:#b9a3ff;color:#d8c8ff;animation:pulse2 2s infinite}.chip.upg .ic{animation:spinu 2.6s linear infinite}@keyframes spinu{to{transform:rotate(360deg)}}
body.fx-calm .chip.upg,body.fx-calm .chip.upg .ic{animation:none}
.chip.upg .upgx{margin-left:6px;padding:0 5px;border-radius:6px;opacity:.75;cursor:pointer}.chip.upg .upgx:hover{opacity:1;background:#ffffff22}

/* ===================== rich editor, handouts, tables ===================== */
.rte{margin-top:10px}
.rte-bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border-radius:12px 12px 0 0;background:#000a;border:1px solid #ffffff2a}
.rte-bar button.rb{padding:3px 9px;font-size:13px;min-width:30px;text-transform:none;letter-spacing:0;font-family:var(--font-b);font-weight:700;background:linear-gradient(180deg,#34397a,#272b61);box-shadow:0 2px 0 #14173a;border-radius:8px}
.rte-bar select{width:auto;padding:4px 6px;font-size:13px;border-radius:8px}
.rte-bar .rsep{width:1px;height:20px;background:#ffffff33;margin:0 3px}
.rte-bar .rcol{position:relative;display:inline-grid;place-items:center;width:28px;height:26px;border-radius:8px;background:#34397a;cursor:pointer;font-weight:800;font-size:13px}
.rte-bar .rcol input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.rte-bar .rtab{display:inline-flex;gap:4px;align-items:center;font-size:13px;flex-wrap:wrap}
.rte-bar .rtab input[type=number]{width:46px;padding:3px 5px;font-size:13px;border-radius:8px}
.rte-ed{min-height:110px;padding:12px 14px;border:1px solid #ffffff2a;border-top:0;border-radius:0 0 12px 12px;background:#0a0b1ecc;outline:none;line-height:1.55;font-size:16px;overflow-wrap:anywhere}
.rte-ed:empty:before{content:attr(data-ph);color:#9da2d6;pointer-events:none}
.rte-ed table,.ans-html table,.mdt{border-collapse:collapse;margin:8px 0;max-width:100%}
.rte-ed td,.rte-ed th,.ans-html td,.ans-html th,.mdt td,.mdt th{border:1px solid #ffffff66;padding:6px 10px;min-width:56px;vertical-align:top}
.fig{margin:10px 0;background:#f4f7ff;border-radius:12px;padding:10px;max-width:640px;color:#1a1f3a}.fig svg{width:100%;height:auto;display:block}.fig figcaption{font-size:13px;margin-top:6px;color:#3a4266}
.rte-ed sup,.ans-html sup,.mdt sup{font-size:.72em;line-height:0;position:relative;top:-.5em;vertical-align:baseline}.rte-ed sub,.ans-html sub,.mdt sub{font-size:.72em;line-height:0;position:relative;top:.28em;vertical-align:baseline}
#calcfab{position:fixed;right:18px;bottom:88px;z-index:60;width:52px;height:52px;border-radius:16px;font-size:26px;padding:0;background:linear-gradient(135deg,#6c4bff,#3b2bb8);box-shadow:0 8px 24px #0009}
#calc{position:fixed;right:20px;bottom:150px;z-index:90;width:340px;max-width:calc(100vw - 24px);background:#12142bf5;border:1px solid #ffffff2e;border-radius:18px;box-shadow:0 20px 60px #000c;backdrop-filter:blur(10px);padding:10px;user-select:none}
.cc-head{display:flex;align-items:center;gap:8px;cursor:grab;padding:2px 4px 8px}.cc-head b{flex:1;font-size:14px}.cc-x{padding:2px 10px;background:#ffffff14}
.cc-disp{background:#05060f;border-radius:12px;padding:8px 10px;margin-bottom:8px}
#cc-in{width:100%;background:transparent;border:0;outline:0;color:#fff;font:600 22px/1.3 "Source Code Pro",ui-monospace,monospace;text-align:right;padding:0;user-select:text}
.cc-res{min-height:24px;text-align:right;color:#8bffb0;font:600 18px "Source Code Pro",ui-monospace,monospace}
.cc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ck{padding:10px 0;font-size:14px;border-radius:10px;font-weight:700;box-shadow:none;border:1px solid #ffffff1a;text-transform:none;letter-spacing:0}
.ck.num{background:#262a52}.ck.op{background:#4b3bd0}.ck.fn{background:#161a38;color:#b9c3ff}.ck.clr{background:#8a2a44}.ck.eq{background:linear-gradient(135deg,#ffc83d,#ff9d1f);color:#2a1b00}.ck.on{background:#ffc83d;color:#2a1b00}
.cc-hist{margin-top:8px;max-height:110px;overflow:auto;font:13px "Source Code Pro",ui-monospace,monospace}.cc-hist div{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-radius:6px;cursor:pointer;color:#b9c3ff}.cc-hist div:hover{background:#ffffff12}.cc-hist b{color:#8bffb0}

/* joy engine */
#joystack{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:70;display:grid;gap:8px;pointer-events:none;width:max-content;max-width:92vw}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <radialGradient id="cg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff4b0"/><stop offset=".55" stop-color="#ffc83d"/><stop offset="1" stop-color="#c77f00"/></radialGradient>
 <linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d2e"/><stop offset=".6" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ffe066"/></linearGradient></defs></svg>
<div id="dragstrip"></div>
<header id="topbar"></header>
<div id="app"></div>
<div id="trophies"></div>
<div id="splash"><div class="sp-logo">⚔️</div><div class="sp-t">STUDY QUEST</div><div class="sp-s">loading your realms…</div><div class="sp-bar"><i></i></div></div>
<nav class="nav" id="nav"></nav>
<canvas id="bg"></canvas>
<div id="glow"></div>
<canvas id="fx"></canvas>
<script src="decks.js"></script>
<script>
/* ================= helpers ================= */
const KEY="studyquest.v2", IMPK="studyquest.v2.decks";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const today=()=>new Date().toISOString().slice(0,10);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= sound (synth, no files) ================= */
let AC=null;
function tone(f,d=.15,type="square",v=.06,slide=0,delay=0){
  if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={
  ok:()=>{tone(660,.1,"square");tone(990,.16,"square",.06,0,.09)},
  hit:()=>{tone(180,.2,"sawtooth",.09,-120);tone(900,.05,"square",.05)},
  crit:()=>{tone(300,.3,"sawtooth",.1,500);tone(1200,.2,"square",.06,0,.1)},
  bad:()=>tone(200,.3,"sawtooth",.08,-120),
  hurt:()=>{tone(140,.3,"square",.1,-80);tone(90,.3,"sawtooth",.08,-40,.05)},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,"triangle",.08,0,i*.1)),
  lose:()=>[400,330,260,180].forEach((f,i)=>tone(f,.3,"sawtooth",.07,0,i*.18)),
  lvl:()=>[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,"square",.06,0,i*.08)),
  coin:()=>{tone(1200,.08,"square",.05);tone(1600,.18,"square",.05,0,.07)},
  tick:()=>tone(900,.03,"square",.03)
};

/* ================= particles ================= */
const cv=$("#fx"),cx=cv.getContext("2d");let P=[],raf=0;
const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};addEventListener("resize",fit);fit();
function burst(x,y,color="#ffc83d",n=26,spd=7){n=fxN(n);for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*spd+2;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,c:color,r:rnd(3,7)})}if(!raf)raf=requestAnimationFrame(loop)}
function confetti(){for(let i=0,N=fxN(120);i<N;i++)P.push({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*4,vy:Math.random()*4+2,l:1.6,c:`hsl(${rnd(0,360)} 90% 60%)`,r:rnd(4,8)});if(!raf)raf=requestAnimationFrame(loop)}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.l-=.02;cx.globalAlpha=Math.max(0,Math.min(1,p.l));cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r)}cx.globalAlpha=1;raf=P.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
const centerOf=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
function flash(c){const e=document.createElement("div");e.className="flash";e.style.background=c;document.body.appendChild(e);setTimeout(()=>e.remove(),400)}

/* ================= game data ================= */
const CLASSES={mage:{n:"Mage",e:"🧙‍♂️",d:"Starts every battle with a free 50/50 hint."},knight:{n:"Knight",e:"🤺",d:"Sturdy: 6 hearts instead of 5."},rogue:{n:"Rogue",e:"🥷",d:"Greedy: +25% gold from everything."}};
const SKINS=[["🧙‍♂️",0],["🤺",0],["🥷",0],["🧝",150],["🦸",150],["🧛",200],["🦊",250],["🐱",250],["🤖",300],["🐉",500],["👑",800]];
const ITEMS={fifty:{e:"💡",n:"50/50",d:"Remove two wrong answers",p:40},skip:{e:"⏭",n:"Skip",d:"Dodge a card (it returns later)",p:30},shield:{e:"🛡",n:"Shield",d:"Block the next hit",p:60},time:{e:"⏱",n:"+10s",d:"Add 10 seconds",p:30},double:{e:"⚡",n:"Overcharge",d:"Next hit does double damage",p:70}};
const MONS=[["Snooze Slime","🟢"],["Doomscroll Bat","🦇"],["Procrastination Goblin","👺"],["Cram Zombie","🧟"],["Anxiety Wraith","👻"],["Phone Distraction Imp","😈"],["Tab-Hoarder Spider","🕷️"],["All-Nighter Owl","🦉"],["Last-Minute Lich","💀"],["Burnout Beast","🐗"],["Coffee Golem","🗿"]];
const BOSSES=[["The Exam Dragon","🐲"],["Syllabus Hydra","🐍"],["Final-Paper Kraken","🦑"],["Chief Procrastinator","👹"]];
const TITLES=["Fresher","Note-Taker","Apprentice","Scholar","Swot","Sage","Prodigy","Grandmaster","Legend"];
const ACH=[
 ["first","First Blood","🗡️","Win a battle",s=>s.st.wins>=1],["combo5","On Fire","🔥","5-answer combo",s=>s.st.bestCombo>=5],["combo10","Unstoppable","⚡","10-answer combo",s=>s.st.bestCombo>=10],
 ["h100","Centurion","💯","Answer 100 questions",s=>s.st.answered>=100],["h500","Veteran","🏅","Answer 500 questions",s=>s.st.answered>=500],
 ["sharp","Sharpshooter","🎯","85%+ accuracy over 50+",s=>s.st.answered>=50&&s.st.correct/s.st.answered>=.85],
 ["str3","Habit Forming","📆","3-day streak",s=>s.streak>=3],["str7","Locked In","🔒","7-day streak",s=>s.streak>=7],
 ["boss","Dragon Slayer","🐲","Defeat a boss",s=>s.st.bosses>=1],["arena10","Arena Champ","🏟️","10 kills in one Arena run",s=>s.st.arenaBest>=10],
 ["rich","Dragon Hoard","💰","Earn 1000 gold",s=>s.st.goldEarned>=1000],["lvl5","Level 5","⭐","Reach level 5",s=>lvl()>=5],["lvl10","Level 10","🌟","Reach level 10",s=>lvl()>=10],
 ["forge","Notebook Keeper","📓","Create a notebook from your notes",s=>(JSON.parse(localStorage.getItem(IMPK)||"[]")).length>0],
 ["paper","Paper Slayer","📜","Beat a paper boss (60%+)",s=>(s.st.papers||0)>=1],["paper90","Examiner's Bane","🏅","Score 90%+ on a paper boss",s=>(s.st.bestPaper||0)>=90],["spell","Spellcaster","📕","Create a spellbook",s=>decks().some(d=>d.type==="spellbook")],["master","Mastery","🎓","Hit 80% mastery in a region",s=>decks().some(d=>mastery(d)>=80)]];
const QUESTS=[["focus","Focus for {n} minutes",()=>25,60],["ans","Answer {n} questions",()=>rnd(15,30),40],["win","Win {n} battles",()=>rnd(2,3),50],["combo","Reach a x{n} combo",()=>rnd(4,7),45],["boss","Defeat a boss",()=>1,80]];

/* ================= state ================= */
let S=loadS();S.prov=S.prov||'anthropic';S.papers=S.papers||{};S.claimed=S.claimed||{};S.chestDay=S.chestDay||"";S.music=!!S.music;S.plog=S.plog||[];S.keys=Array.isArray(S.keys)?S.keys:[];while(S.keys.length<6)S.keys.push("");if(S.key&&!S.keys.some(Boolean))S.keys[0]=S.key;delete S.key;S.kidx=S.kidx||0;S.kbad=S.kbad||{};
function loadS(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch(e){}
 return {name:"",cls:"",skin:"",owned:["🧙‍♂️","🤺","🥷"],xp:0,gold:60,streak:0,lastDay:"",exam:today(),sound:true,items:{fifty:2,skip:1,shield:1,time:1,double:1},
  box:{},miss:{},stars:{},ach:{},st:{answered:0,correct:0,bestCombo:0,wins:0,bosses:0,arenaBest:0,goldEarned:0},daily:{day:"",q:[],right:0}}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const lvl=()=>Math.floor(Math.sqrt(S.xp/60))+1, lvlAt=l=>(l-1)*(l-1)*60;
const avatar=()=>S.skin||CLASSES[S.cls]?.e||"🙂";
let _dc=null;
function decks(){if(_dc)return _dc;const raw=JSON.parse(localStorage.getItem(IMPK)||"[]"),by=Object.fromEntries(raw.map(n=>[n.id,n]));
  const imp=raw.map(n=>n.type==="spellbook"?{...n,cards:(n.links||[]).flatMap(id=>by[id]&&by[id].type!=="spellbook"?by[id].cards.map(c=>({...c,_src:id})):[]).concat(n.cards||[])}:n);
  return _dc=(window.DECKS||[]).concat(imp)}
const ucards=d=>d.type==="spellbook"?d.cards.filter(c=>!c._src):d.cards;
const deck=id=>decks().find(d=>d.id===id);
const cid=(d,c)=>(c._src||d.id)+"::"+c.q;
const box=(d,c)=>S.box[cid(d,c)]||0;
/* spaced repetition: every answer schedules the card's next review (box 1→1 day, 2→3, 3→7, 4→16, 5→35); a miss is due again in minutes */
const INT=[.007,1,3,7,16,35];
function srs(k){S.due=S.due||{};S.due[k]=Date.now()+INT[Math.min(S.box[k]||0,5)]*864e5}
(function(){S.due=S.due||{};const now=Date.now();for(const k in S.box)if(S.box[k]>0&&!S.due[k])S.due[k]=now+Math.random()*INT[Math.min(S.box[k],5)]*864e5})();
const mastery=d=>d.cards.length?Math.round(d.cards.reduce((n,c)=>n+Math.min(box(d,c),4),0)/(d.cards.length*4)*100):0;
const daysLeft=()=>Math.ceil((new Date(S.exam+"T23:59:59")-new Date())/864e5);
function ensureDaily(){if(S.daily.day!==today()){S.daily={day:today(),right:0,q:shuffle(QUESTS).slice(0,3).map(([id,t,f,r])=>{const n=f();return{id,t:t.replace("{n}",n),n,v:0,r,done:false}})};save()}}
function remaining(){return decks().reduce((t,d)=>t+ucards(d).reduce((n,c)=>n+Math.max(0,4-box(d,c)),0),0)}
function target(){return Math.max(10,Math.ceil(remaining()/Math.max(1,daysLeft())))}
function questProg(id,v,set){ensureDaily();for(const q of S.daily.q){if(q.id!==id||q.done)continue;q.v=set?Math.max(q.v,v):q.v+v;if(q.v>=q.n){q.done=true;gainGold(q.r);toast("📜 Quest done! +"+q.r+" 🪙")}}}
function gainGold(n){n=Math.round(n*(S.cls==="rogue"?1.25:1));S.gold+=n;S.st.goldEarned+=n;return n}
function gainXP(n){const b=lvl();S.xp+=n;xpFloat(n);if(lvl()>b){SFX.lvl();confetti();gainGold(50);levelUp(lvl())}return n}
function touchStreak(){const d=today();if(S.lastDay===d)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=d}
function checkAch(){for(const[id,n,e,d,t]of ACH){if(!S.ach[id]&&t(S)){S.ach[id]=1;trophy(e,n,d);SFX.coin();gainGold(25)}}save()}

/* ================= router ================= */
let view="map",arg=null,B=null;
function go(v,a){if(B){stopBattle()}document.onkeydown=null;clearInterval(PT);if((v==="forge"||v==="books")&&view!==v)resetNF();view=v;arg=a;render()}
const NAV=[["map","🗺️","Realms"],["forge","📓","Notebooks"],["books","📕","Spellbooks"],["hq","🎯","Exam HQ"],["arena","🏟️","Arena"],["tutor","🧙","Sage"],["hero","🦸","Hero"]];
const navOn=v=>v===view||(v==="map"&&["region","train","psetup","paper","presult","shop"].includes(view))||(v==="forge"&&(view==="nb"||view==="handout"||(view==="review"&&RV&&RV.f.kind==="nb")))||(v==="books"&&(view==="spell"||(view==="review"&&RV&&RV.f.kind==="spell")));
function render(){
  applyFx();
  document.body.classList.remove("inbattle");document.body.classList.toggle("inpaper",view==="paper");document.body.classList.toggle("onboarding",!S.name);
  document.documentElement.style.setProperty("--hue",view==="region"||view==="train"?(hueOf(arg)):255);
  $("#nav").innerHTML=S.name&&view!=="battle"&&view!=="paper"?NAV.map(([v,e,n])=>`<button class="${navOn(v)?"on":""}" onclick="go('${v}')"><b>${svgIcon(v)}</b>${n}</button>`).join(""):"";
  updateTop();
  if(!S.name)return onboard();
  ensureDaily();touchStreakView();({map:vMap,region:vRegion,train:vTrain,arena:vArena,shop:vShop,hero:vHero,forge:vForge,nb:vNb,handout:vHandout,tutor:vTutor,books:vBooks,hq:vHQ,spell:vSpell,review:vReview,psetup:vPSetup,paper:vPaper,presult:vPResult,result:vResult,cal:vCal}[view]||vMap)();window.scrollTo(0,0);calcFab();app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter")
}
const touchStreakView=()=>{};
const hueOf=id=>{const i=decks().findIndex(d=>d.id===id);return i<0?255:(i*67+250)%360};

/* ================= onboarding ================= */
let pick="mage";
function onboard(){
  app.innerHTML=`<div class="center" style="padding-top:30px"><div class="big">⚔️</div><h1>Study Quest</h1><p class="mu">Your notes are a dungeon. Time to clear it before exams.</p></div>
  <div class="glass"><div class="mu">Hero name</div><input type="text" id="nm" maxlength="16" placeholder="Enter your name"></div>
  <div class="grid g3">${Object.entries(CLASSES).map(([k,c])=>`<div class="glass cls ${k===pick?"on":""}" onclick="pick='${k}';onboard()"><div class="big" style="font-size:48px">${c.e}</div><b>${c.n}</b><div class="mu">${c.d}</div></div>`).join("")}</div>
  <button style="width:100%;margin-top:10px" onclick="startGame()">Begin the quest</button>`;
}
function startGame(){const n=$("#nm").value.trim();if(!n)return $("#nm").focus();S.name=n;S.cls=pick;save();render()}

/* ================= map ================= */
const RANKS=[["Bronze","🥉",0,"#cd7f32"],["Silver","🥈",300,"#c3cbe0"],["Gold","🥇",900,"#ffc83d"],["Platinum","💠",2000,"#6fe3ff"],["Diamond","💎",4000,"#7aa8ff"],["Master","👑",7500,"#c77dff"],["Legend","🔥",12000,"#ff6a3d"]].map(([n,e,min,c])=>({n,e,min,c}));
const rank=()=>[...RANKS].reverse().find(r=>S.xp>=r.min)||RANKS[0],nextRank=()=>RANKS.find(r=>r.min>S.xp);
const SKIN_REW={5:"🧝",10:"🦸",15:"🧛",20:"🦊",25:"🤖",30:"👑"};
function reward(l){if(SKIN_REW[l])return{e:SKIN_REW[l],t:"Skin "+SKIN_REW[l],skin:SKIN_REW[l]};if(l%3===0){const k=Object.keys(ITEMS)[(l/3)%5|0];return{e:ITEMS[k].e,t:ITEMS[k].n+" ×2",item:k,n:2}}const g=30+l*8;return{e:"🪙",t:g+" gold",gold:g}}
function claimReward(n){if(S.claimed[n]||n>lvl())return;const r=reward(n);S.claimed[n]=1;if(r.gold)gainGold(r.gold);if(r.item)S.items[r.item]=(S.items[r.item]||0)+r.n;if(r.skin&&!S.owned.includes(r.skin))S.owned.push(r.skin);SFX.coin();confetti();save();trophy(r.e,"Reward claimed",r.t);updateTop();vMap()}
const chestReady=()=>S.chestDay!==today();

/* ================= question builders ================= */
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const close=(g,a)=>{const x=norm(g),y=norm(a);return x&&(x===y||lev(x,y)<=Math.floor(y.length/6))};
function distractors(d,c){
  let w=(c.wrong||[]).filter(x=>x&&x!==c.a);
  if(w.length<3){
    const wc=x=>String(x).split(/\s+/).length,len=wc(c.a),k=c.kind||"";
    const rank=cs=>{const seen=new Set();return cs.filter(x=>x.a!==c.a&&!c.q.includes(x.a)&&!seen.has(x.a)&&seen.add(x.a)).map(x=>({a:x.a,s:Math.abs(wc(x.a)-len)+Math.random()*1.5-(x.topic&&x.topic===c.topic?1.5:0)})).sort((p,q)=>p.s-q.s).map(x=>x.a)};
    w=w.concat(rank(d.cards.filter(x=>(x.kind||"")===k)),rank(d.cards),rank(decks().filter(x=>x.id!==d.id).flatMap(x=>ucards(x))))}
  return[...new Set(w)].filter(a=>a!==c.a).slice(0,3)}
/* A question that TELLS you to produce something. "Write the inequality for luggage under 23 kg" is an
   instruction, and turning it into "is this the right answer? True/False" is incoherent - the question
   orders you to write an inequality and the screen asks you to judge one. The card type was being drawn
   at random with no regard at all for the words in the question, so one in five of these came out
   nonsense, in every notebook.

   These questions can still be multiple choice - picking w < 23 out of four inequalities tests the same
   discrimination - but they are never True/False, and they are preferred as type-it-out, which is what
   the question actually asked for. */
const IMPERATIVE=/^\s*(?:write|state|give|calculate|find|work out|solve|name|define|list|express|convert|simplify|factorise|factorize|evaluate|draw|sketch|complete|fill in|show that|prove)\b/i;

function makeQ(d,c){
  const q=String(c.q||""),a=String(c.a);
  const ws=a.split(/\s+/).length,r=Math.random(),dis=distractors(d,c);
  const told=IMPERATIVE.test(q);
  if(dis.length<2)return{t:"type"};
  /* produce-it questions: type it out whenever it is short enough to type, otherwise choose from four */
  if(told){
    if(a.length<=40&&box(d,c)>=1&&r<.55)return{t:"type"};
    return{t:"mcq",opts:shuffle([a,...dis]),dis};
  }
  if(ws<=4&&a.length<=32&&box(d,c)>=1&&r<.4)return{t:"type"};
  if(r<.2)return{t:"tf",ok:Math.random()<.5,shown:null,dis};
  return{t:"mcq",opts:shuffle([a,...dis]),dis};
}

    let pool=mode==="review"?all.filter(({d,c})=>S.miss[cid(d,c)]):mode==="quick"?(window.QP||weakest(8)):all;
    if(mode==="review"&&!pool.length){toast("No fallen cards — nothing to revive!");return}
    if(!all.length)return;
    B={mode,pool:pool.map(x=>x),queue:[],kills:0,hearts:3};cards=[];window.QP=null;
    B.hearts=S.cls==="knight"?4:3;if(mode==="quick")B.hearts=S.cls==="knight"?5:4;
  }else{
    d=deck(deckId);const st=stagesOf(d);const isBoss=mode==="boss";
    cards=isBoss?shuffle(d.cards).slice(0,Math.min(12,d.cards.length)):st[mode];

    const m=isBoss?BOSSES[bi]:MONS[(mode+hueOf(d.id))%MONS.length];B.mname=m[0];B.memo=m[1];B.hpMax=cards.length*(isBoss?16:12)
  }
  Object.assign(B,{joy:joyNew(),maxHearts:B.hearts,combo:0,bestCombo:0,right:0,wrong:0,gold:0,xp:0,guard:0,double:false,free50:S.cls==="mage"?1:0,locked:false,dead:false,seen:new Set(),energy:0,armed:null,phase:1,speed:1,paused:false,pot:0,lastStand:false});
  if(B.mode==="arena"||B.mode==="review"||B.mode==="quick")newMonster();else B.hp=B.hpMax;
  view="battle";drawBattle();calcFab();vsIntro(()=>{if(!B)return;next();banner(B.mode==="boss"?"BOSS FIGHT":"FIGHT!",B.mname)});

/* Leaving with half of it, instead of leaving with nothing.
   The pot is what this fight has been worth so far - it grows with every right answer and grows faster
   on a combo - and it is only banked if you WIN. Flee and you keep half; die and you keep none. That is
   the whole stake, and it is what makes "one more question" an actual decision rather than a habit:
   every time the pot gets fat, walking away gets more tempting and losing gets more expensive. */
function flee(){
  if(!B||B.locked)return;
  const take=Math.floor((B.pot||0)/2);
  if(!confirm(take?`Flee with ${take} gold?\n\nYou are carrying ${B.pot}. Fleeing banks half of it. Win the fight and you keep all of it; lose and you keep nothing.`
                  :"Flee the battle? You have not won anything yet, so there is nothing to carry out."))return;
  const b=B;clearInterval(b.timer);stopBattle();B=b;
  gainGold(take);save();
  R={win:false,fled:true,stars:0,gold:take,xp:Math.round((b.xp||0)/2),chest:null,b};
  gainXP(Math.round((b.xp||0)/2));
  view="result";B=null;SFX.lose();render()
}

function rng(seed){let a=(seed|0)||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function silURI(kind,color,seed,depth){
  const r=rng(seed*13+({far:1,mid:2,near:3}[depth]||1)),W=1200,H=200,k={far:.55,mid:.8,near:1}[depth]||1;let d="M0,"+H,extra="";

  else if(kind==="castle"){let x=0;while(x<W){const w=50+r()*60,h=(50+r()*100)*k;d+=` L${x},${H} L${x},${H-h}`;const n=Math.max(2,Math.floor(w/12));for(let i=0;i<n;i++){const cx=x+i*(w/n),up=i%2?0:10;d+=` L${cx},${H-h-up} L${cx+w/n},${H-h-up}`}d+=` L${x+w},${H-h} L${x+w},${H}`;x+=w+10+r()*40}d+=` L${W},${H}`}

  else if(kind==="volcano"){let x=-40;while(x<W){const w=240+r()*160,h=(90+r()*70)*k,t=w*.18;d+=` L${x},${H} L${x+w/2-t},${H-h} L${x+w/2+t},${H-h} L${x+w},${H}`;if(depth!=="far")extra+=`<path d='M${x+w/2-t},${H-h} L${x+w/2+t},${H-h} L${x+w/2+t*.6},${H-h+10} L${x+w/2-t*.6},${H-h+10}Z' fill='#ff7a2a' opacity='.85'/>`;x+=w*.7}d+=` L${W},${H}`}

const VET_SYS=`You are checking quiz questions before a student sees them. For each question you get ONLY what the student gets: the question and its options. You do NOT get the source material, and neither will they.
Mark a question as BROKEN when it cannot be answered from its own words - because it silently depends on a table, a graph, a diagram, a passage, an experiment, or one particular case whose values are never given. "What is the cost per GB?" is broken: which plan? "What is the value of x?" is broken: which x? "How many chose football?" is broken: in what survey?
A question is FINE when someone who knows the subject could answer it: it names its own subject ("the atomic number of carbon"), or it carries its own numbers ("a 2 GB plan costs 80, what is the cost per GB?"), or it asks for a definition, a cause, a method or a fact.
Reply ONLY with a JSON array of the numbers of the BROKEN ones, e.g. [2,5] - or [] if they are all fine.`;

async function vetCards(cards){
  const list=(cards||[]).filter(c=>c&&c.q);
  if(list.length<1||!aiReady())return cards;
  const shown=list.map((c,i)=>{
    const opts=[c.a].concat(Array.isArray(c.wrong)?c.wrong:[]).filter(Boolean);
    return `${i+1}. ${c.q}${opts.length>1?"\n   options: "+shuffle(opts.slice()).join(" | "):""}`
  }).join("\n");
  let drop=[];
  try{
    const t=await Promise.race([
      llm([{role:"user",content:shown}],{system:VET_SYS,max:200}),
      new Promise((_,no)=>setTimeout(()=>no(new Error("slow")),15000))
    ]);
    const a=t.indexOf("["),b=t.lastIndexOf("]");
    if(a>=0&&b>a)drop=JSON.parse(t.slice(a,b+1));
  }catch(e){return cards}                       // it must never be the reason a notebook fails to build
  if(!Array.isArray(drop)||!drop.length)return cards;
  const gone=new Set(drop.map(n=>parseInt(n,10)-1).filter(n=>n>=0&&n<list.length));
  if(gone.size>=list.length)return cards;       // it rejected everything, so it misunderstood the task
  return list.filter((_,i)=>!gone.has(i))
}
async function aiCards(text,name,progress,onWait,onPartial,alive=()=>true){
  const chunks=chunkText(text).slice(0,40),res=new Array(chunks.length).fill(undefined),fb={};let done=0,nx=0,outage=false;
  const basic=i=>fb[i]||(fb[i]=cardsFromText(cleanNotes(chunks[i]).text).filter(c=>!isJunkCard(c)));
  const tidy=out=>{const seen=new Set();return out.filter(c=>c&&typeof c.q==="string"&&typeof c.a==="string"&&String(c.a).length<=160&&!seen.has(c.q)&&seen.add(c.q))
    .map(c=>({q:c.q.trim(),a:String(c.a).trim(),topic:(c.topic||"").trim(),kind:c.kind,wrong:Array.isArray(c.wrong)?c.wrong.filter(w=>typeof w==="string"&&w&&w!==c.a).slice(0,3):[],note:c.note||""}))};
  const merged=()=>tidy(res.flatMap((arr,i)=>Array.isArray(arr)?arr:basic(i)));     // AI cards where Sage has finished, basic cards for the rest
  const one=async i=>{
    let last;
    for(let t=0;t<3;t++){
      if(!alive())throw new Error(CANCEL_MSG);
      try{const arr=parseArrStrict(await llm([{role:"user",content:`Notebook: ${name}\n\nNOTES CHUNK ${i+1}/${chunks.length}:\n${chunks[i]}`}],{system:aiSys(),max:prov().outMax||4000,patient:true,paced:true,onWait,alive}));if(arr)return await vetCards(arr);last=new Error("unreadable reply")}
      catch(e){last=e;if(e.message===CANCEL_MSG)break;aiLog(`Section ${i+1}/${chunks.length} failed: ${e.message}`);if(modelErr(e)){outage=true;break}if(e.message===BUSY_MSG||/all 6 keys|rejected/i.test(e.message)){outage=true;break}}
      await sleepMs(700*(t+1)+Math.random()*400)
    }
    throw last
  };
  await Promise.all(Array.from({length:Math.max(1,Math.min(prov().conc,chunks.length))},async()=>{while(nx<chunks.length){const i=nx++;
    if(outage||!alive()){res[i]=null}else{try{res[i]=await one(i)}catch(e){res[i]=null}}
    done++;progress&&progress(done,chunks.length);
    if(onPartial&&Array.isArray(res[i])){try{onPartial(merged(),res.filter(Array.isArray).length,chunks.length)}catch(e){}}}}));
  const failed=res.filter(r=>r===null).length;
  return{cards:merged(),failed,total:chunks.length,cancelled:!alive()}
}
async function aiBuild(sources,name){
  for(const s of sources){if(s.cards)continue;busy("✨ Sage is reading “"+esc(s.name)+"”…");
    try{const r=await aiCards(s.text,name,(d,n)=>busy(`✨ Sage is reading “${esc(s.name)}” — ${d}/${n}`));if(r.cards.length)s.cards=r.cards;if(r.failed)toast(`⚠️ ${r.failed}/${r.total} sections used basic cards — the AI was busy`)}catch(e){}}
  busy()
}
/* ---------- background upgrade: you study immediately, Sage improves the cards while you play ---------- */
let UPG=null;const UPQ=[];
function refreshIf(id){if(B||view==="paper"||view==="battle")return;if(view==="region"&&arg===id)vRegion();else if(view==="map")vMap()}   // never re-render screens where you might be typing
const pendKey=(id,only)=>id+":"+(only?only.join(","):"*");
function pendAdd(id,only){S.pend=S.pend||[];const k=pendKey(id,only);if(!S.pend.some(p=>p.k===k)){S.pend.push({k,id,only,tries:0});save()}}
function pendDone(id,only){S.pend=(S.pend||[]).filter(p=>p.k!==pendKey(id,only));save()}
async function upgradeNB(id,only,resume){
  if(!aiReady())return;
  if(UPG){if(!UPQ.some(q=>q[0]===id&&String(q[1])===String(only)))UPQ.push([id,only]);return}
  const nb0=NBS().find(d=>d.id===id);if(!nb0)return pendDone(id,only);
  const idxs=(only||nb0.sources.map((_,i)=>i).filter(i=>!nb0.sources[i].cards)).filter(i=>nb0.sources[i]&&!garbled(nb0.sources[i].text));
  if(!idxs.length)return pendDone(id,only);
  const tok={cancel:false},alive=()=>!tok.cancel&&NBS().some(d=>d.id===id);
  pendAdd(id,only);UPG={id,name:nb0.name,done:0,total:idxs.length,sub:"",tok};updateTop();
  aiLog(`Upgrade started: “${nb0.name}” (${idxs.length} file${idxs.length>1?"s":""})${resume?" — resumed after restart":""}`);
  let made=0,basic=0,tot=0;
  for(const i of idxs){
    if(!alive())break;
    const nb=NBS().find(d=>d.id===id);if(!nb||!nb.sources[i])continue;
    try{
      UPG.cd=0;UPG.ct=1;
      const r=await aiCards(nb.sources[i].text,nb.name,(d,n)=>{if(UPG){UPG.sub=`${d}/${n}`;UPG.cd=d;UPG.ct=n;updateTop()}},m=>{if(UPG){UPG.sub=m;updateTop()}},(cards,ai)=>{if(ai<1)return;const all=NBS(),n2=all.find(d=>d.id===id);if(n2&&n2.sources[i]){n2.sources[i].cards=cards;rebuild(n2);saveNBS(all);refreshIf(id)}},alive);
      if(r.cancelled)break;
      basic+=r.failed;tot+=r.total;
      if(r.failed>=r.total){const all=NBS(),n4=all.find(d=>d.id===id);if(n4&&n4.sources[i]){n4.sources[i].aiTries=(n4.sources[i].aiTries||0)+1;n4.sources[i].aiLast=Date.now();saveNBS(all)}}
      if(r.failed<r.total&&r.cards.length>=3){const all=NBS(),n2=all.find(d=>d.id===id);if(n2&&n2.sources[i]){n2.sources[i].cards=r.cards;rebuild(n2);saveNBS(all);made+=r.cards.length}}
      aiLog(`“${nb.sources[i].name}”: ${r.total-r.failed}/${r.total} sections written by AI, ${r.cards.length} cards`)
    }catch(e){basic++;tot++;aiLog("File failed: "+e.message)}
    if(UPG){UPG.done++;UPG.sub="";updateTop()}refreshIf(id)
  }
  if(!alive()){const nm=UPG&&UPG.name;UPG=null;updateTop();
    (S.pend||[]).filter(p=>p.id===id).forEach(p=>pendDone(p.id,p.only));
    aiLog(`Upgrade stopped: “${nm}” — ${NBS().some(d=>d.id===id)?"stopped by you":"notebook was deleted"}`);
    const nx=UPQ.shift();if(nx&&!SAGE_PAUSED)upgradeNB(nx[0],nx[1]);return}
  // the planner text the cleaner set aside tells Sage what the summative is (used when writing papers)
  try{const all=NBS(),n3=all.find(d=>d.id===id),pl=n3&&(n3.sources||[]).flatMap(s=>s.cut||[]).join("\n");
    if(n3&&pl&&pl.length>120&&!(n3.unit&&n3.unit.summative)){const u=await aiUnit(pl);if(u){n3.unit={...(n3.unit||{}),...u,planner:pl.slice(0,12000)};saveNBS(all)}}}catch(e){}
  const name=UPG&&UPG.name;UPG=null;updateTop();refreshIf(id);
  if(made||basic<tot)pendDone(id,only);                       // otherwise stay pending and retry on the next launch
  aiLog(`Upgrade finished: “${name}” — ${made} AI cards${basic?`, ${basic}/${tot} sections stayed basic`:""}`);
  toast(made?`✨ Sage upgraded “${name}” — ${made} better cards${basic?` (${basic}/${tot} sections stayed basic — AI was busy, tap ✨ Upgrade to retry)`:""}`:`⚠️ The AI couldn't upgrade “${name}” yet (it was too busy or rate-limited). Your basic cards still work — Sage will retry next time you open the app, or press ✨ Upgrade.`);
  const nx=UPQ.shift();if(nx&&!SAGE_PAUSED)upgradeNB(nx[0],nx[1])
}
/* stop Sage's background work: one notebook (deleted), or everything until the next launch (Stop button) */
let SAGE_PAUSED=false;
function cancelUpgrade(id){
  if(UPG&&UPG.id===id&&UPG.tok)UPG.tok.cancel=true;
  for(let k=UPQ.length-1;k>=0;k--)if(UPQ[k][0]===id)UPQ.splice(k,1);
  S.pend=(S.pend||[]).filter(p=>p.id!==id);save()
}
function stopSage(){
  SAGE_PAUSED=true;UPQ.length=0;
  if(UPG&&UPG.tok){UPG.tok.cancel=true;UPG.sub="stopping…";updateTop()}
  aiLog("Sage paused by you — background upgrades resume next time you open the app or press ✨ Upgrade");
  toast("⏹ Sage stopped. It'll pick up again next launch, or when you press ✨ Upgrade notebooks.")
}
/* old notebooks and failed attempts are retried automatically — no buttons, no questions */
function autoUpgradeAll(){
  if(!aiReady()||UPG||SAGE_PAUSED)return;
  NBS().forEach(n=>{const need=(n.sources||[]).map((s,i)=>(!s.cards&&!garbled(s.text)&&(s.aiTries||0)<5&&Date.now()-(s.aiLast||0)>15*60000)?i:-1).filter(i=>i>=0);if(need.length)upgradeNB(n.id,need)})
}
setInterval(autoUpgradeAll,10*60000);
function upgradeAll(){
  if(!aiReady())return toast("Sage is locked — enter all 6 keys in the Sage tab first");
  SAGE_PAUSED=false;
  const todo=NBS().filter(n=>(n.sources||[]).some(s=>!s.cards&&!garbled(s.text)));
  if(!todo.length)return toast("✨ Every notebook is already upgraded");
  todo.forEach(n=>upgradeNB(n.id));toast(`✨ Upgrading ${todo.length} notebook${todo.length>1?"s":""} in the background — keep studying`)
}
function resumePending(){
  if(!aiReady())return;
  autoUpgradeAll();
  if(!(S.pend||[]).length)return;
  (S.pend||[]).slice().forEach(p=>{if(p.tries>=8||!NBS().some(n=>n.id===p.id)){pendDone(p.id,p.only);return}p.tries++;upgradeNB(p.id,p.only,true)});save()
}

  for(const k of Object.keys(S.miss))if(k.startsWith(id+"::"))delete S.miss[k];

}

const mdBase=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^#{1,4}\s*(.+)$/gm,"<b style=\"font-size:17px\">$1</b>").replace(/^\s*[-*]\s+/gm,"• ").replace(/\n/g,"<br>");
/* tables that the model glues onto a sentence or leaves unterminated are repaired into proper |-rows on their own lines */
const isRow=l=>(l.match(/\|/g)||[]).length>=2&&/^\s*\|/.test(l);
const isSep=l=>/^\s*\|?\s*:?-{2,}[\s|:\-]*$/.test(l)&&l.includes("|");
function fixPipes(t){
  const out=[];
  for(const l of String(t).split("\n")){
    const m=l.match(/^(.*?\S)\s*(\|.*\|.*)$/);
    if(m&&!/^\s*\|/.test(l)&&(m[2].match(/\|/g)||[]).length>=3){out.push(m[1],"",m[2])}else out.push(l)}
  return out.join("\n")
}
function mdTable(lines){
  const cells=l=>l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  const hdr=cells(lines[0]),n=hdr.length;let body=lines.slice(1);if(body.length&&isSep(body[0]))body=body.slice(1);
  const extra=[];
  const rows=body.map(r=>{let c=cells(r);if(c.length>n){extra.push(c.slice(n).join(" ").trim());c=c.slice(0,n)}while(c.length<n)c.push("");return c});
  return`<div class="mdt-wrap"><table class="mdt"><thead><tr>${hdr.map(c=>`<th>${mdBase(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${mdBase(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${extra.filter(Boolean).length?`<div>${mdBase(extra.filter(Boolean).join(" "))}</div>`:""}`
}
/* markdown with real tables (a header row followed by |---| makes a table) */
const md=t=>{const L=fixPipes(t).split("\n"),out=[];let buf=[];const flush=()=>{if(buf.length){out.push(mdBase(buf.join("\n")));buf=[]}};
  for(let i=0;i<L.length;i++){if(isRow(L[i])&&i+1<L.length&&isSep(L[i+1])){flush();const blk=[L[i++]];while(i<L.length&&isRow(L[i]))blk.push(L[i++]);i--;out.push(mdTable(blk))}else buf.push(L[i])}
  flush();return out.join("")};

function detectSOI(texts){
  const lines=String(texts||"").split(/\n/).map(x=>x.trim());
  for(let i=0;i<lines.length;i++){const m=lines[i].match(/^(?:\W*)statement of inquiry\s*[:\-–—]?\s*(.*)$/i);if(!m)continue;

  return""
}

function calNote(nb,c){
  const fw=nb.fw||"none",crit=(c&&c.id)||"";

const PCT_DP=[[78,7],[66,6],[54,5],[43,4],[32,3],[20,2]];
/* ============================ calibration ============================
   What this is for: until now every number this app showed you was its own opinion. It wrote the
   paper, wrote the markscheme, awarded the mark, and then told you what grade that was worth - with
   nothing anywhere checking that against a grade a real teacher actually gave you. If its standard
   ran a band soft you would grind to 85% on Master papers, walk into a summative feeling ready, and
   come out with a 5, and the app would never find out.

   So: you type in what you really got, and it corrects itself.

   The MYP shape it corrects toward (checked against published sources, see the notes by MYP_BANDS):
   four criteria, each 0-8, totalling 32, and the 32 maps to the 1-7 you actually get on a report. It
   is NOT a percentage, which is why "82% on the paper" was never really an answer to "what grade is
   that". Percentages are what this app can measure; criterion levels are what you are marked in.    */

/* School-based MYP grade boundaries, total out of 32 across four equally weighted criteria.
   NOTE on sourcing: this table is reported consistently by several MYP teaching resources, but the
   IB's own published copy sits behind the Programme Resource Centre and could not be opened to check
   it. Treat it as a good default, not as gospel - and if your school's table differs, the calibration
   below will absorb the difference anyway, because it learns from YOUR results rather than this table.
   Separately: this is the SCHOOL grading table. External eAssessment is marked on raw marks with
   boundaries set per session, so do not read an eAssessment mark against this.                       */
const MYP_GRADE=[[28,7],[24,6],[19,5],[15,4],[10,3],[6,2],[0,1]];
const gradeFromTotal=t=>(MYP_GRADE.find(([m])=>t>=m)||[0,1])[1];
/* The four achievement bands inside one criterion. 0 is outside them: it means the work reached none
   of the described standards, which is not the same as "scored badly". */
const MYP_BANDS=[[7,"excellent"],[5,"substantial"],[3,"adequate"],[1,"limited"],[0,"not shown"]];
const bandOf=lv=>(MYP_BANDS.find(([m])=>lv>=m)||[0,"not shown"])[1];

/* ---- the asymmetry, which is the whole safety of this thing ----
   A marker that corrects itself in both directions can correct itself into uselessness. If you beat its
   prediction once - a kind marker, a topic you happened to revise, a lucky paper - it starts marking you
   softer, and softer marking produces higher predictions, which is the exact failure this loop was built
   to stop. It would be a machine for telling you what you want to hear, with evidence.

   So the two directions are NOT treated the same, because their costs are not the same:

     told you are WORSE than you thought  -> costs you an evening of extra revision
     told you are BETTER than you thought -> costs you the grade

   Therefore it will harden on a single result and by up to two levels, and it will soften only after
   three results and never by more than one. When the evidence is thin, it stays where it is.           */
const CAL_HARSH=2.0, CAL_SOFT=1.0, CAL_SOFT_MIN_N=3;
function calClamp(off,n){
  if(!n)return 0;
  if(off<0)return Math.max(-CAL_HARSH,off);            // harder: believed immediately
  if(n<CAL_SOFT_MIN_N)return 0;                        // easier: not on one or two results
  return Math.min(CAL_SOFT,off)
}

const realLog=()=>Array.isArray(S.real)?S.real:(S.real=[]);
const calKey=(fw,crit)=>`${fw||"none"}|${String(crit||"").toUpperCase()}`;

/* How far off this app has been, for this subject and this criterion.
   Shrunk toward zero by the +2: one surprising result should nudge the app, not reverse it. The more
   real grades you give it, the more it believes them and the less it believes its own marking. */
function calOffset(fw,crit){
  const rows=realLog().filter(r=>r.fw===(fw||"none")&&String(r.crit).toUpperCase()===String(crit||"").toUpperCase()&&typeof r.predicted==="number"&&typeof r.level==="number");
  if(!rows.length)return{off:0,n:0};
  const sum=rows.reduce((n,r)=>n+(r.level-r.predicted),0);
  return{off:sum/(rows.length+2),n:rows.length}
}
/* the whole-subject offset, used when a criterion has no history of its own yet */
function calSubject(fw){
  const rows=realLog().filter(r=>r.fw===(fw||"none")&&typeof r.predicted==="number"&&typeof r.level==="number");
  if(!rows.length)return{off:0,n:0};
  return{off:rows.reduce((n,r)=>n+(r.level-r.predicted),0)/(rows.length+2),n:rows.length}

/* a raw percentage on one criterion, as a criterion level - corrected by whatever the real world has

/* ================= rich text editor: fonts, sizes, alignment, tables, colours… ================= */
const RT_TAGS=new Set("B STRONG I EM U S STRIKE DEL SUB SUP BR P DIV SPAN UL OL LI TABLE THEAD TBODY TFOOT TR TD TH H1 H2 H3 H4 HR FONT CODE PRE BLOCKQUOTE MARK COLGROUP COL".split(" "));
const RT_CSS=/^(font-family|font-size|font-weight|font-style|text-decoration|text-decoration-line|text-align|color|background-color|background|border|border-collapse|border-top|border-bottom|border-left|border-right|padding|width|vertical-align|line-height|margin|margin-left)$/;
/* anything pasted or stored goes through this: only harmless tags/styles survive */
function sanitizeHtml(html){
  const doc=new DOMParser().parseFromString("<body>"+String(html||"")+"</body>","text/html");
  const walk=node=>{[...node.childNodes].forEach(ch=>{
    if(ch.nodeType===3)return;
    if(ch.nodeType!==1){ch.remove();return}
    if(!RT_TAGS.has(ch.tagName)){
      if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|FORM|INPUT|BUTTON|SVG|MATH|TEMPLATE|NOSCRIPT)$/.test(ch.tagName)){ch.remove();return}
      walk(ch);while(ch.firstChild)node.insertBefore(ch.firstChild,ch);ch.remove();return}
    [...ch.attributes].forEach(a=>{const n=a.name.toLowerCase();
      if(n==="style"){const keep=a.value.split(";").map(x=>x.trim()).filter(x=>{const[p,...v]=x.split(":");return p&&RT_CSS.test(p.trim().toLowerCase())&&!/url\(|expression|javascript|@import/i.test(v.join(":"))}).join(";");keep?ch.setAttribute("style",keep):ch.removeAttribute("style")}
      else if(!["colspan","rowspan","face","size","color","align"].includes(n))ch.removeAttribute(a.name)});
    walk(ch)})};
  walk(doc.body);
  doc.body.querySelectorAll("span[style]").forEach(sp=>{const m=(sp.getAttribute("style")||"").match(/vertical-align:\s*(super|sub)/i);if(!m)return;const t=doc.createElement(m[1].toLowerCase()==="super"?"sup":"sub");while(sp.firstChild)t.appendChild(sp.firstChild);sp.replaceWith(t)});
