 fx:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
 timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/>'};
const svgIcon=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`;
const ICO={
 coin:'<svg class="ic ico-coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="url(#cg)" stroke="#9a6700" stroke-width="1.2"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="#9a6700" stroke-width="1" opacity=".55"/><path d="M12 7.6v8.8M10 10h3.1a1.55 1.55 0 0 1 0 3.1H10" fill="none" stroke="#7a4f00" stroke-width="1.5" stroke-linecap="round"/></svg>',
 flame:'<svg class="ic ico-flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.9 3.9 5.2 5.6 5.2 11a5.2 5.2 0 0 1-10.4 0c0-2.1 1-3.6 2.1-4.7.1 2 1 3 2.1 3 0-3.2-1.1-5.7 1-9.3z" fill="url(#fg)"/><path d="M12 12.5c.4 1.4 2 2 2 3.6a2 2 0 0 1-4 0c0-1 .6-1.7 1.2-2.3.3.7.7 1 .8 1 0-1.1-.3-1.7 0-2.3z" fill="#fff3b0" opacity=".9"/></svg>'};
if(/Electron/.test(navigator.userAgent)&&/Mac/i.test(navigator.platform||navigator.userAgent))document.body.classList.add("electron");
/* ---- in-app updates (desktop app): new versions of the game download in place; saves and keys are untouched ---- */
var SQ_VERSION=(document.querySelector('meta[name="sq-version"]')||{}).content||"0";
async function sqCheck(manual){
  if(!window.sqDesktop)return;
  const r=await window.sqDesktop.check();
  if(r.available){window.__sqUpd=r.latest;updateTop();if(view==="hero")vHero();if(manual)toast(`⬆️ Version ${r.latest} is ready — press Update`);else toast(`⬆️ A new Study Quest (v${r.latest}) is ready — press Update in the top bar`)}
  else if(manual)toast(r.error?"⚠️ "+r.error:`✅ You're on the latest version (v${r.current})`)
}
async function sqDoUpdate(){
  if(!window.sqDesktop)return;
  if(B||view==="paper")return toast("Finish this battle or paper first, then update");
  save();busy(`⬆️ Updating to v${esc(window.__sqUpd||"")}… your progress and keys stay exactly as they are`);
  const r=await window.sqDesktop.update();
  if(!r.ok){busy();toast("⚠️ "+r.error)}   // on success the window reloads into the new version
}
if(window.sqDesktop){setTimeout(()=>sqCheck(false),5000);setInterval(()=>sqCheck(false),6*36e5)}   // only the macOS window hides its title bar
function xpFloat(n){if(!(n>0))return;const e=document.createElement("div");e.className="xpf";e.textContent="+"+n+" XP";document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button");if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");s.className="rip";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),620)},true);
(function(){ // soft light that follows the cursor
  if(matchMedia("(pointer:coarse)").matches)return;let raf=0,x=0,y=0;
  document.addEventListener("pointermove",e=>{x=e.clientX;y=e.clientY;if(!raf)raf=requestAnimationFrame(()=>{raf=0;document.documentElement.style.setProperty("--gx",x+"px");document.documentElement.style.setProperty("--gy",y+"px")})},{passive:true})
})();
/* ---------- focus sessions (a Pomodoro-style timer, with breaks) ---------- */
const FXL=()=>S.fx||"balanced";
const fxN=n=>Math.max(1,Math.round(n*(FXL()==="calm"?.3:FXL()==="hype"?1.4:1)));
function applyFx(){["calm","balanced","hype"].forEach(l=>document.body.classList.toggle("fx-"+l,FXL()===l))}
function setFx(l){S.fx=l;save();applyFx();updateTop();if(view==="hero")vHero();toast({calm:"🌿 Calm — minimal effects, maximum focus",balanced:"⚖️ Balanced — the default",hype:"🔥 Hype — all the juice"}[l])}
function cycleFx(){setFx({calm:"balanced",balanced:"hype",hype:"calm"}[FXL()])}
function cyclePressure(){
  S.pressure=((S.pressure||2)%4)+1;save();updateTop();SFX.ui();
  const P=PRESSURE[S.pressure];
  toast(`⏱ Pressure: ${P.n} — ${P.d}. Bosses always run one step above this.`);
  if(B)toast("Takes effect on the next question");
}
function focusLeft(){return S.fs?S.fs.start+S.fs.len*60000-Date.now():0}
function startFocus(min,kind="focus"){if(S.fs)return toast("A session is already running");S.fs={start:Date.now(),len:min,kind};save();updateTop();if(view==="map")vMap();toast(kind==="focus"?`🎯 Focus started — ${min} minutes. Notes open, phone away.`:`☕ Break — ${min} minutes. Stand up, drink water.`)}
function stopFocusAsk(){const f=S.fs;if(!f)return;const done=Math.floor((Date.now()-f.start)/60000);if(confirm(f.kind==="break"?"End the break?":`Stop the session? You've done ${done} min${done>=5?" — that will still count.":" (under 5 min doesn't count)."}`))endFocus(true)}
function endFocus(early,late){
  const f=S.fs;if(!f)return;S.fs=null;
  if(f.kind==="break"){save();updateTop();if(!late)toast("☕ Break over — ready when you are");if(view==="map")vMap();return}
  const done=early?Math.floor((Date.now()-f.start)/60000):f.len;
  if(done>=5){gainXP(done*2);gainGold(done);if(!S.focusDay||S.focusDay.day!==today())S.focusDay={day:today(),min:0};S.focusDay.min+=done;S.st.focusMin=(S.st.focusMin||0)+done;questProg("focus",done)}
  save();updateTop();
  if(early)toast(done>=5?`Stopped early — ${done} min counted`:"Stopped — under 5 minutes doesn't count");
  else if(!late){SFX.win();confetti();trophy("🎯","Focus complete",`${done} min · +${done*2} XP`);try{new Notification("Study Quest","Focus session complete — take a 5 minute break.")}catch(e){}setTimeout(()=>{if(confirm("Nice work! Start a 5-minute break timer?"))startFocus(5,"break")},900)}
  if(view==="map")vMap()
}
setInterval(()=>{if(!S.fs)return;const l=focusLeft(),c=document.getElementById("fchip");if(c)c.textContent=fmt(l);if(l<=0)endFocus(false,l<-120000)},1000);
/* ---------- game-center chrome ---------- */
function updateTop(){
  const el=$("#topbar");if(!el)return;
  if(!S.name||view==="battle"||view==="paper"){el.style.display="none";return}
  el.style.display="";const l=lvl(),p=Math.round((S.xp-lvlAt(l))/(lvlAt(l+1)-lvlAt(l))*100);
  el.innerHTML=`<div class="brand">⚔️ <b>STUDY QUEST</b></div><div class="me" onclick="go('hero')" title="Your hero"><span class="av" style="--p:${p}"><span>${avatar()}</span></span><div class="lv"><b>${esc(S.name)}</b><span>LEVEL ${l}</span><div class="bar xp"><i style="width:${p}%"></i></div></div></div><div class="spacer"></div><span class="chip rank" style="--rc:${rank().c}" title="Your rank" onclick="go('hero')">${rank().e} ${rank().n}</span><span class="chip ${S.gold!==window.__g?"pop":""}" onclick="go('shop')" title="Shop">${ICO.coin}${S.gold}</span><span class="chip" title="Day streak">${ICO.flame}${S.streak}</span>${UPG?`<button class="chip upg" title="Sage is improving “${esc(UPG.name)}” in the background — you can already play it" onclick="go('hero')">${svgIcon("tutor")}<span>${UPG.done}/${UPG.total}${UPG.sub?" · "+UPG.sub:""}</span><span class="upgx" title="Stop Sage" onclick="event.stopPropagation();stopSage()">✕</span></button>`:""}${window.__sqUpd?`<button class="chip upg" title="A new version of Study Quest is ready — your progress and keys stay" onclick="sqDoUpdate()">⬆️<span>Update to v${esc(window.__sqUpd)}</span></button>`:""}<button class="chip" title="Effects: ${FXL()} (click to change)" onclick="cycleFx()">${svgIcon("fx")}<span class="fxl">${{calm:"Calm",balanced:"Balanced",hype:"Hype"}[FXL()]}</span></button><button class="chip pres p${S.pressure||2}" title="How hard it squeezes: ${PRESSURE[S.pressure||2].n} — ${PRESSURE[S.pressure||2].d}. Bosses run one step harder. Click to change." onclick="cyclePressure()">⏱<span>${PRESSURE[S.pressure||2].n}</span></button>${S.fs?`<button class="chip focus ${S.fs.kind}" title="Focus session — click to stop" onclick="stopFocusAsk()">${svgIcon("timer")}<span id="fchip">${fmt(focusLeft())}</span></button>`:""}<button class="chip ${S.music?"":"dim"}" title="Music" onclick="S.music=!S.music;save();music(S.music);updateTop()">${svgIcon("music")}</button><button class="chip" title="Sound effects" onclick="S.sound=!S.sound;save();updateTop();SFX.ui()">${svgIcon(S.sound?"vol":"mute")}</button>`;window.__g=S.gold
}
function trophy(e,n,d){
  const box=$("#trophies");if(!box)return;const t=document.createElement("div");t.className="trophy";
  t.innerHTML=`<div class="te">${e}</div><div><small>TROPHY UNLOCKED</small><b>${esc(n)}</b><span>${esc(d)}</span></div>`;box.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add("in")));
  setTimeout(()=>{t.classList.remove("in");setTimeout(()=>t.remove(),600)},3800)
}
function levelUp(l){const e=document.createElement("div");e.className="lvlup";e.innerHTML=`<small>LEVEL UP</small><b>${l}</b><span>+50 🪙 bonus</span>`;document.body.appendChild(e);setTimeout(()=>e.remove(),2900);updateTop()}
function countUps(){document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count,pre=el.dataset.pre||"",suf=el.dataset.suf||"",t0=performance.now(),D=900+Math.min(700,to*5);const f=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=pre+Math.round(to*e)+suf;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
SFX.ui=()=>tone(700,.03,"triangle",.02);SFX.nav=()=>{tone(520,.05,"triangle",.03);tone(780,.07,"triangle",.03,0,.04)};
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button,.cover,.tile.click,.node,.me,.chip");if(!b||b.disabled)return;b.closest(".nav")?SFX.nav():SFX.ui()},true);
document.addEventListener("pointerdown",()=>{if(S.music&&!MUS)music(true)},true);
(function(){ // 3D tilt on cards
  if(matchMedia("(pointer:coarse)").matches)return;
  document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest(".cover,.tile.click");if(!t)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(800px) rotateY(${x*11}deg) rotateX(${-y*11}deg) translateY(-6px)`},{passive:true});
  document.addEventListener("pointerout",e=>{const t=e.target.closest&&e.target.closest(".cover,.tile.click");if(t&&!t.contains(e.relatedTarget))t.style.transform=""},true)
})();
(function(){ // drifting starfield behind everything
  const c=$("#bg");if(!c)return;const x=c.getContext("2d");let W,H,st=[];
  const fit=()=>{W=c.width=innerWidth;H=c.height=innerHeight;st=Array.from({length:Math.round(W*H/15000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,v:Math.random()*.16+.03,a:Math.random()*6}))};
  fit();addEventListener("resize",fit);const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function f(){if(!document.hidden&&!document.body.classList.contains("inbattle")&&!document.body.classList.contains("fx-calm")&&view!=="paper"){x.clearRect(0,0,W,H);x.fillStyle="#fff";for(const s of st){s.y-=s.v;if(s.y<0){s.y=H;s.x=Math.random()*W}s.a+=.02;x.globalAlpha=.3+.35*Math.sin(s.a);x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()}x.globalAlpha=1}if(!calm)requestAnimationFrame(f)})()
})();
setTimeout(()=>{const sp=$("#splash");if(sp){sp.classList.add("out");setTimeout(()=>sp.remove(),700)}},950);
addEventListener("pointerdown",()=>{try{AC&&AC.state==="suspended"&&AC.resume()}catch(e){}},{once:true});
try{if(localStorage.getItem("studyquest.v2.cv")!=="9"){const l=JSON.parse(localStorage.getItem("studyquest.v2.decks")||"[]");let cut=0;l.forEach(n=>{const was=(n.cards||[]).length;rebuild(n);cut+=Math.max(0,was-(n.cards||[]).length)});localStorage.setItem("studyquest.v2.decks",JSON.stringify(l));localStorage.setItem("studyquest.v2.cv","9");if(cut>0)setTimeout(()=>toast("🧹 Removed "+cut+" planner / resource cards from your notebooks"),1600)}}catch(e){}
const _fixed=autoFixProvider();
/* ---------- one-off: throw out cards already saved that nobody could answer ----------
   rebuild() runs every card through isJunkCard, so the new check applies to old notebooks too - but
   only when something makes rebuild run, and nothing does for a notebook you are not editing. So it
   is run once here, and the count is said out loud rather than silently: cards vanishing with no
   explanation is worse than the bad cards were.                                                    */
if(S.ctxSweep!==3){
  try{
    const all=NBS();let dropped=0;
    for(const nb of all){const before=(nb.cards||[]).length;rebuild(nb);dropped+=Math.max(0,before-(nb.cards||[]).length)}
    if(dropped)saveNBS(all);
    S.ctxSweep=3;save();
    if(dropped)setTimeout(()=>toast(`🧹 Removed ${dropped} question${dropped>1?"s":""} that needed a table or graph you never saw`),2600);
  }catch(e){S.ctxSweep=3;save()}
}
render();
/* notebooks built before the .pptx reader existed hold raw file bytes: say so once per launch */
setTimeout(()=>{const bad=NBS().filter(n=>(n.sources||[]).some(x=>garbled(x.text)));if(!bad.length)return;
  const e=document.createElement("div");e.className="toast";e.textContent=`⚠️ ${bad.map(n=>"“"+n.name+"”").join(", ")} ${bad.length>1?"were":"was"} made from a file the app couldn't read, so its cards are gibberish. Delete it and upload the file again — .pptx works now.`;
  document.body.appendChild(e);setTimeout(()=>e.remove(),12000)},2500);
if(_fixed){setTimeout(()=>toast("🔧 Your keys are "+PROVIDERS[S.prov].n+" keys — I switched the provider from the wrong one"),1800);setTimeout(async()=>{const ok=await silentTest();aiLog(ok?`Self-test: ${ok} key(s) work — resuming notebook upgrades`:"Self-test: no key worked — check them in the Sage tab");if(ok)resumePending()},3500)}
else setTimeout(resumePending,4500);
</script>
